[package]
name = "nqv-desktop"
version.workspace = true
description = "nqv desktop: quick-look viewer for NetCDF model output"
edition.workspace = true
license.workspace = true

[lib]
# the `_lib` suffix keeps the name of the library apart from the binary's (Windows)
name = "nqv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nqv-core = { path = "../crates/nqv-core", features = ["serde"] }
nqv-render = { path = "../crates/nqv-render" }
nqv-session = { path = "../crates/nqv-session" }
nqv-proto = { path = "../crates/nqv-proto" }
anyhow = "1.0.104"
tauri-plugin-updater = "2"
