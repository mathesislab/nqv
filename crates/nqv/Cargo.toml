[package]
name = "nqv"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nqv-core = { path = "../nqv-core" }
nqv-proto = { path = "../nqv-proto" }
nqv-render = { path = "../nqv-render" }
nqv-session = { path = "../nqv-session" }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
