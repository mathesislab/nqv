name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    # one draft release for the build jobs: each creating its own, they race and make
    # two. A manual run needs a tag selected: the release is named after the ref.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            # the id from the answer: a new draft is not listed at once
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" -F draft=true --jq .id)
          fi
          # without an id, the builds would skip their uploads
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # file names without the version: the website links to the latest release
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            assets: nqv-desktop-linux-[arch][ext]
          - os: macos-15
            args: --bundles app,dmg
            assets: nqv-desktop-macos-[arch][ext]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # not code-signed or notarized; a person reviews the draft before publishing. The
      # updates are signed with the updater's key (its public key is in tauri.conf.json);
      # latest.json tells the apps about them.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          assetNamePattern: ${{ matrix.assets }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  cli:
    # the terminal viewer: static Linux binaries (for HPC systems, as scripts/deploy.sh
    # builds them) and macOS
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: nqv-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: nqv-linux-aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            name: nqv-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # linked by rust-lld (.cargo/config.toml): no C toolchain for the musl targets
      - run: cargo build --release --locked -p nqv --target ${{ matrix.target }}
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/${{ matrix.target }}/release/nqv ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}/assets?name=${{ matrix.name }}" \
            --input ${{ matrix.name }} --jq .browser_download_url
